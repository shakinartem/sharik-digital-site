name = "sharik-digital-site"
compatibility_date = "2026-09-26"

# Cloudflare Pages: статический экспорт Next.js из папки out/
pages_build_output_dir = "out"

# Сборка для дашборда Cloudflare Pages:
#   Build command:            npm run build
#   Build output directory:   out
#   Node version:             22

# ---------------------------------------------------------------------------
# Привязки
#
# Пока проект управляется через wrangler.toml, обычные переменные и биндинги
# нельзя добавить кнопками в дашборде — он их отклоняет. Поэтому KV
# объявляется здесь. Секреты сюда НЕ пишутся: они задаются командой
#   npx wrangler pages secret put <ИМЯ>
# и хранятся в зашифрованном виде.
# ---------------------------------------------------------------------------

# Контент админки: статьи, кейсы, отзывы. Именно сюда «Сохранить»
# кладёт markdown перед публикацией.
[[kv_namespaces]]
binding = "CONTENT"
id = "1a4d0569de914ad3b02cdd69f24ab1d1"

# События аналитики: клики по CTA, запуск калькуляторов, скролл статей.
[[kv_namespaces]]
binding = "ANALYTICS"
id = "9cecb052736c48dcad2e602ce7266d87"

# ---------------------------------------------------------------------------
# Медиатека (R2)
#
# Привязка закомментирована намеренно: если объявить несуществующий
# бакет, деплой упадёт и сайт перестанет обновляться.
#
# Чтобы включить загрузку картинок:
#   1. В дашборде Cloudflare откройте R2 и включите сервис.
#      Cloudflare требует активацию вручную, через API она недоступна.
#   2. Создайте бакет с именем sharik-media.
#   3. Раскомментируйте блок ниже.
#   4. Выполните npm run deploy.
#
# Бакет остаётся приватным: файлы отдаёт /media/... через Pages Function.
# Публичный домен r2.dev не используется — он открывает листинг бакета.
# ---------------------------------------------------------------------------
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "sharik-media"

# ---------------------------------------------------------------------------
# Переменные
#
# Не секреты: их видно в дашборде, поэтому сюда попадает только то, что
# не даёт доступа. Токен GitHub и пароль админки — в secrets, см. выше.
# ---------------------------------------------------------------------------
[vars]
GITHUB_REPO = "shakinartem/sharik-digital-site"
GITHUB_BRANCH = "feature/final-layout-funnel"
