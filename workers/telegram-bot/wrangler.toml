name = "sharik-digital-telegram-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "sharik-digital-bot-db"
database_id = "aa1d4767-0ed9-4803-9f62-ea7f9bd4a688"

[vars]
SITE_URL = "https://sharik-digital.ru"
CHECKLIST_URL = "https://sharik-digital.ru/checklists/clinic.pdf"
# Чек-лист продавца. Раньше этой переменной не было, и сценарий kit_
# отдавал бы вместо файла заглушку.
CHECKLIST_KIT_URL = "https://sharik-digital.ru/checklists/kit.pdf"
BOT_USERNAME = "sharik_digital_bot"

# Secrets (set via `wrangler secret put`):
# BOT_TOKEN
# ADMIN_CHAT_ID
# WEBHOOK_SECRET